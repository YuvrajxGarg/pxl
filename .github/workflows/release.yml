# Builds PXL for macOS and Windows when a version tag (v1.2.3) is pushed, and
# attaches the apps to that GitHub release. Installed copies check the latest
# release for updates:
# What people download (installer/ builds these):
#   macOS   -> PXL.dmg          (drag to Applications)
#   Windows -> PXL-Setup.exe    (setup wizard)
# What installed copies update from (keep these: every existing install uses them):
#   macOS   -> PXL-mac.zip      + .sha256
#   Windows -> PXL-windows.zip  + .sha256
#
# Adding or changing apps does NOT need a release: PXL reads apps.json from main.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release stays a draft until both apps are attached, so the updater never
      # sees a published release that's missing a platform's download.
      - name: Create the draft release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "PXL ${TAG#v}" --generate-notes --verify-tag --draft

  build:
    needs: release
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version from the tag
        run: echo "${TAG#v}" > VERSION
      - run: pip install pyinstaller -r requirements.txt
      - run: python -m unittest discover tests
      - run: pyinstaller --noconfirm --log-level WARN PXL.spec
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent PXL.app PXL-mac.zip
          shasum -a 256 PXL-mac.zip > PXL-mac.zip.sha256
          cat PXL-mac.zip.sha256
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: installer/build_mac.sh PXL && installer/test_mac.sh PXL
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path PXL -DestinationPath PXL-windows.zip
          $h = (Get-FileHash PXL-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  PXL-windows.zip" | Out-File -Encoding ascii -NoNewline PXL-windows.zip.sha256
          Get-Content PXL-windows.zip.sha256
      - name: Setup wizard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          installer/build_windows.ps1 -App PXL -Version $env:TAG -Url https://pxlvzn.in
          installer/test_windows.ps1 -App PXL
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then files="dist/PXL-mac.zip* dist/PXL.dmg*"
          else files="dist/PXL-windows.zip* dist/PXL-Setup.exe*"; fi
          gh release upload "$TAG" $files --clobber

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish once both apps are attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          for a in PXL-mac.zip PXL-mac.zip.sha256 PXL-windows.zip PXL-windows.zip.sha256 PXL.dmg PXL-Setup.exe; do
            echo "$assets" | grep -qx "$a" || { echo "missing $a, leaving the release as a draft"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
