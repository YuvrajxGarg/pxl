<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PXL</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash" class="pywebview-drag-region">
    <div class="glow"></div>
    <canvas id="splash-pixels"></canvas>
    <span class="mark splash-mark" style="--size:84px"><span class="l">p</span><span class="l">x</span><span class="l">l</span><span class="px solo drop"></span></span>
    <div class="splash-status">A technical creative suite</div>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="titlebar pywebview-drag-region"></div>
      <div class="side-scroll">
        <nav class="card nav" id="nav">
          <button data-view="discover" class="on"><i data-icon="grid"></i><span>Discover</span></button>
          <button data-view="installed"><i data-icon="box"></i><span>Installed</span><em id="count-installed"></em></button>
          <button data-view="updates"><i data-icon="refresh"></i><span>Updates</span><em id="count-updates" class="lime"></em></button>
        </nav>

        <div class="label side-label">Your apps</div>
        <div class="library" id="library"></div>
      </div>

      <footer id="footer">
        <div class="frow" id="check-row"><i class="dot"></i><span id="check-line">Checking for apps…</span></div>
        <div class="frow brandrow">
          <span class="mark" style="--size:14px"><span>pxl</span><span class="px solo"></span></span>
          <span id="version"></span>
          <button class="update-pill hidden" id="update-pill"></button>
        </div>
      </footer>
    </aside>

    <main id="content">
      <div class="topbar pywebview-drag-region">
        <label class="search" id="search-box"><i data-icon="search"></i><input id="search" placeholder="Search apps" spellcheck="false" autocomplete="off"></label>
        <div class="top-actions">
          <button class="btn-quiet hidden" id="update-all"><i data-icon="download"></i>Update all</button>
          <button class="btn-icon filled" id="refresh" title="Check for new apps and updates"><i data-icon="refresh"></i></button>
          <button class="btn-icon filled" id="open-settings" title="Settings"><i data-icon="gear"></i></button>
        </div>
      </div>
      <div id="view" class="view"></div>
      <div id="detail" class="detail hidden"></div>
    </main>
  </div>

  <div id="welcome" class="hidden"></div>
  <div id="coach" class="hidden"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
